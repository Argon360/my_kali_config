# vim:fileencoding=utf-8:foldmethod=marker

# ==============================================================================
#  THEME & APPEARANCE (Tokyo Night / Modern Dark)
# ==============================================================================
# BEGIN_KITTY_THEME
include current-theme.conf
# END_KITTY_THEME

background_opacity         0.85
dynamic_background_opacity  yes
window_padding_width       8 12
placement_strategy         center
hide_window_decorations    yes

# ==============================================================================
#  FONTS & GLYPH RENDERING
# ==============================================================================
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
disable_ligatures never
box_drawing_scale 0.001, 1, 1.5, 2
undercurl_style  thin-sparse

# ==============================================================================
#  CURSOR & MOUSE DYNAMICS
# ==============================================================================
cursor_shape                 block
cursor_shape_unfocused       hollow
cursor_beam_thickness        1.5
cursor_underline_thickness   2.0
cursor_blink_interval        -1
cursor_stop_blinking_after   -5.0
cursor_trail                 75
cursor_trail_decay           0.1 0.35
cursor_trail_start_threshold 2

# --- Smooth Kinetic Scrolling & Mousing (Kitty 0.46+) ---
pixel_scroll             yes
momentum_scroll          0.96
touch_scroll_multiplier  2.0

# --- Interactive Scrollbar (Kitty 0.43+) ---
scrollbar                scrolled
scrollbar_interactive    yes
scrollbar_width          5
scrollbar_gap            2
scrollbar_radius         2
scrollbar_handle_opacity 0.6
scrollbar_track_opacity  0.0

# --- GPU Custom Shaders (Kitty 0.49 / 0.50+) ---
# Motion blur for smooth cursor trails + subtle focus highlight on active split
custom_shaders           cursor-trail-motion-blur focus-highlight

mouse_hide_wait        1.0
detect_urls            yes
url_style              curly
open_url_with          default
show_hyperlink_targets no
underline_hyperlinks   hover
copy_on_select         yes

# ==============================================================================
#  LAYOUTS & WINDOW SPLITS
# ==============================================================================
# Enabled layouts: splits (manual tiling), stack (zoom), tall (master-stack), fat, grid
enabled_layouts splits:split_axis=horizontal,stack,tall:bias=60,fat:bias=60,grid

remember_window_position              yes
window_border_width                   1.2pt
draw_minimal_borders                  yes
draw_window_borders_for_single_window no
inactive_text_alpha                   0.82

# ==============================================================================
#  TAB BAR (Polished Powerline with Process & Status Badges)
# ==============================================================================
tab_bar_min_tabs            1
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_bar_align               left
tab_activity_symbol         "● "
bell_on_tab                 "🔔 "
tab_bar_margin_height       2.0 0.0
tab_title_template          "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.program_status} {index}  {title} "
active_tab_title_template   "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.program_status} {index}  {title} "
active_tab_font_style       bold-italic
inactive_tab_font_style     normal
tab_bar_show_new_tab_button yes
drag_threshold              5

# ==============================================================================
#  SYSTEM, PERFORMANCE & AUDIO
# ==============================================================================
scrollback_lines     15000
scrollback_pager_history_size 256
linux_display_server auto
sync_to_monitor      yes
repaint_delay        8
input_delay          2
allow_remote_control yes
listen_on            unix:${XDG_RUNTIME_DIR}/kitty.sock
shell_integration    enabled
visual_bell_duration 0.1
window_alert_on_bell yes
enable_audio_bell    no

# Restore complete session (tabs, splits, scrollback) on reboot/logout (Kitty 0.50+)
restore_session_after_logout yes

# ==============================================================================
#  KEYBINDINGS
# ==============================================================================

# --- Layout Management ---
# Cycle: Splits -> Stack -> Tall (60% Master) -> Fat -> Grid
map ctrl+shift+l next_layout
# Zoom: Toggle full screen (Stack layout)
map ctrl+shift+z toggle_layout stack

# --- Split Windows ---
map ctrl+shift+h launch --location=hsplit
map ctrl+shift+v launch --location=vsplit
map ctrl+alt+n   new_window
map ctrl+alt+q   close_window

# --- Split Pane Cycling & Directional Navigation ---
map ctrl+shift+[ previous_window
map ctrl+shift+] next_window
map ctrl+shift+alt+left  neighboring_window left
map ctrl+shift+alt+right neighboring_window right
map ctrl+shift+alt+up    neighboring_window up
map ctrl+shift+alt+down  neighboring_window down

# --- Tab Management ---
map ctrl+t           new_tab
map ctrl+shift+t     new_tab
map ctrl+w           close_tab
map ctrl+shift+w     close_tab
map ctrl+tab         next_tab
map ctrl+shift+tab   previous_tab
map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab
map alt+1            goto_tab 1
map alt+2            goto_tab 2
map alt+3            goto_tab 3
map alt+4            goto_tab 4
map alt+5            goto_tab 5
map alt+6            goto_tab 6
map alt+7            goto_tab 7
map alt+8            goto_tab 8
map alt+9            goto_tab 9
map ctrl+shift+d     detach_tab ask
map ctrl+shift+m     detach_window ask

# --- Shell Prompt Navigation (Jump between commands) ---
map ctrl+shift+up   scroll_to_prompt -1
map ctrl+shift+down scroll_to_prompt 1

# --- Scrollback & Output Inspection ---
map ctrl+shift+grave show_last_command_output
map ctrl+shift+backslash show_scrollback

# --- Clipboard & Basics ---
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
map ctrl+alt+enter toggle_fullscreen

# --- Quick Select / Hints & Kittens (Kitty 0.42+) ---
# Select URLs
map ctrl+shift+e kitten hints --type url
# Select Paths (Insert)
map ctrl+shift+p kitten hints --type path --program -
# Select Hashes (Git)
map ctrl+shift+y kitten hints --type hash --program -
# Select Words
map ctrl+shift+n kitten hints --type word --program -
# Select Lines
map ctrl+shift+j kitten hints --type line --program -
# Fuzzy Emoji & Nerd Font Symbol Picker
map ctrl+shift+u kitten unicode_input
# Command Palette (Search all actions)
map ctrl+shift+k command_palette
# Fast visual file picker with previews
map ctrl+shift+f kitten choose-files
# Drag and drop terminal files
map ctrl+shift+g kitten dnd
# Interactive split & edge resizing
map ctrl+shift+r start_resizing_window
# Broadcast keystrokes to all panes
map ctrl+shift+b kitten broadcast

# --- Font Sizes ---
map ctrl+plus  increase_font_size
map ctrl+minus decrease_font_size
map ctrl+0     reset_font_size

# --- Opacity Control ---
map ctrl+shift+o set_background_opacity 0.85
map ctrl+shift+1 set_background_opacity 1.0
map ctrl+shift+2 set_background_opacity 0.9
map ctrl+shift+3 set_background_opacity 0.8
map ctrl+shift+4 set_background_opacity 0.7
map ctrl+shift+5 set_background_opacity 0.6
map ctrl+shift+6 set_background_opacity 0.5
map ctrl+shift+7 set_background_opacity 0.4
map ctrl+shift+8 set_background_opacity 0.3
map ctrl+shift+9 set_background_opacity 0.2
map ctrl+shift+0 set_background_opacity 0.1

# --- Shell / FZF Integration (Sends text) ---
# File search
map ctrl+alt+p send_text all \cf
# History search
map ctrl+alt+h send_text all \cr
# Directory jump
map ctrl+alt+j send_text all \cd
# Kill process
map ctrl+alt+x send_text all \ck
# Unified FZF Menu
map ctrl+alt+m send_text all \cg
