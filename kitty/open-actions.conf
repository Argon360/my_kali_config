# Open-actions configuration for Kitty
# Defines smart actions when clicking files, paths, and URLs in terminal

# Open text files with line numbers in Neovim (e.g. file.rs:42)
protocol file
fragment_matches [0-9]+
action launch --type=overlay ${EDITOR:-nvim} +${FRAGMENT} ${FILE_PATH}

# Open regular text files directly in Neovim
protocol file
mime text/*
action launch --type=overlay ${EDITOR:-nvim} ${FILE_PATH}

# View image files with Kitty's icat graphics protocol in an overlay
protocol file
mime image/*
action launch --type=overlay kitten icat --hold ${FILE_PATH}

# Open directories in terminal or file manager
protocol file
mime inode/directory
action launch --type=tab --cwd ${FILE_PATH}
